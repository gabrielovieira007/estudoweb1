<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Death Note</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<header class="bg-black text-center p-4 mb-4">
    <h1>Death Note Quiz</h1>
    <p>Teste seus conhecimentos sobre o universo de Death Note</p>
</header>

<main class="container">

    <section class="bg-secondary p-4 rounded mb-4">
        <h3 class="mb-3">Responda as perguntas</h3>

        <form id="quizForm">

            <div class="mb-3">
                <label class="form-label fw-bold">1) Qual é o nome verdadeiro do personagem L?</label>

                <div><input type="radio" name="q1" value="0"> Ren Oba</div>
                <div><input type="radio" name="q1" value="1"> L Lawliet</div>
                <div><input type="radio" name="q1" value="0"> Nate River</div>
            </div>

        
            <div class="mb-3">
                <label class="form-label fw-bold">2) Quais desses são Shinigamis? (Escolha 2)</label>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="q2" value="1">
                    <label class="form-check-label">Ryuk</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="q2" value="1">
                    <label class="form-check-label">Rem</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="q2" value="0">
                    <label class="form-check-label">Near</label>
                </div>
            </div>

            
            <div class="mb-3">
                <label class="form-label fw-bold">3) O Death Note tem a seguinte regra básica:</label>

                <select class="form-select" name="q3">
                    <option value="">Selecione...</option>
                    <option value="0">A pessoa revive após 24h</option>
                    <option value="1">A pessoa cujo nome for escrito morre</option>
                    <option value="0">A pessoa fica invisível por 1 hora</option>
                </select>
            </div>

            
            <div class="mb-3">
                <label class="form-label fw-bold">4) Qual é o nome do próprio Death Note que Ryuk deixou cair na Terra?</label>
                <input class="form-control" type="text" name="q4" placeholder="Digite a resposta">
            </div>

          
            <div class="mb-3">
                <label class="form-label fw-bold">5) Quem é o verdadeiro “Kira”?</label>

                <div><input type="radio" name="q5" value="1"> Light Yagami</div>
                <div><input type="radio" name="q5" value="0"> Matsuda</div>
                <div><input type="radio" name="q5" value="0"> L (Lawliet)</div>
            </div>

            <button type="submit" class="btn btn-danger w-100">Enviar Respostas</button>
        </form>
    </section>

    <section id="resultado" class="bg-secondary p-4 rounded d-none">
        <h3 class="text-center">Resultado do Quiz</h3>
        <p id="mensagem" class="fs-5"></p>
        <div id="feedbackArea"></div>
    </section>

</main>

<footer class="text-center p-3 bg-black text-white mt-4">
    <small>Desenvolvido como atividade prática</small>
</footer>

<script src="script.js"></script>

</body>
</html>
